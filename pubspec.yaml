name: lintel
description: Lintel — Real estate CRM for Nigerian agencies.
publish_to: 'none'
version: 1.0.0+24

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.0.0

  # Backend
  supabase_flutter: ^2.15.0
  postgrest: ^2.7.2
  gotrue: ^2.22.0
  realtime_client: ^2.8.0
  storage_client: ^2.5.7
  functions_client: ^2.6.1

  # Networking
  dio: ^5.9.2

  # Formatting & locale
  intl: ^0.20.2

  # Charts (1.x needs a newer Flutter than 3.29; 0.69 is the compatible line)
  fl_chart: ^0.69.0

  # PDF generation (receipts)
  pdf: ^3.11.0
  printing: ^5.13.0

  csv: ^6.0.0
  excel: ^4.0.6

  # Local prefs
  shared_preferences: ^2.5.3

  # Files & images
  image_picker: ^1.2.1
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1

  # Utilities
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  lottie: ^3.3.0
  flutter_svg: ^2.2.2
  google_fonts: ^6.3.2
  connectivity_plus: ^7.2.0

  cupertino_icons: ^1.0.8
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/legal/
    - assets/lottie/

# Native launch screen. Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0F4F37"
  android_12:
    color: "#0F4F37"

# Launcher icons. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_master_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0F4F37"
  adaptive_icon_foreground: "assets/icons/adaptive_foreground_1024.png"
  min_sdk_android: 21