name: lintel
description: Lintel — Real estate CRM for Nigerian agencies.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter


  # State management
  flutter_riverpod: 2.5.1

  # Routing
  go_router: 13.2.5

  # Backend — pinned to versions that compile on Dart 3.3
  supabase_flutter: 2.5.0
  postgrest: 2.1.1
  gotrue: 2.6.0
  realtime_client: 2.0.4
  storage_client: 2.1.0
  functions_client: 2.0.0

  # Networking
  dio: 5.4.3+1

  # Formatting & locale
  intl: 0.19.0

  # Charts
  fl_chart: 0.67.0

  # PDF generation (receipts) — kept at versions that resolve on Flutter 3.19.6
  pdf: 3.10.8
  printing: 5.12.0

  csv: ^6.0.0
  excel: ^4.0.6

  # Local prefs
  shared_preferences: 2.2.3

  # Files & images
  image_picker: 1.0.8
  file_picker: 8.0.0+1
  cached_network_image: 3.3.1

  # Utilities
  uuid: 4.3.3
  url_launcher: 6.2.5
  lottie: ^3.1.2
  flutter_svg: 2.0.10+1
  google_fonts: 6.2.1
  connectivity_plus: 6.0.1

  cupertino_icons: 1.0.6
  web: ^0.5.1

# Forces a pdf_widget_wrapper that compiles against newer Flutter's
# ViewConfiguration (fixes "No named parameter with the name 'size'") while
# still resolving on the local Flutter 3.19.6 SDK.
dependency_overrides:
  pdf_widget_wrapper: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/legal/
    - assets/lottie/

# Native launch screen (the instant pre-engine paint). Solid brand green so
# there's no white flash before the Lottie splash plays.
#   regenerate with:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0F4F37"
  android_12:
    color: "#0F4F37"

# App launcher icons for Android + iOS. Drop a 1024x1024 PNG at the path below.
#   regenerate with:  dart run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_master_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0F4F37"
  adaptive_icon_foreground: "assets/icons/adaptive_foreground_1024.png"
  min_sdk_android: 21