name: lintel
description: Lintel — Real estate CRM for Nigerian agencies.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter


  # State management
  flutter_riverpod: 2.5.1

  # Routing
  go_router: 13.2.5

  # Backend — pinned to versions that compile on Dart 3.3
  supabase_flutter: 2.5.0
  postgrest: 2.1.1
  gotrue: 2.6.0
  realtime_client: 2.0.4
  storage_client: 2.1.0
  functions_client: 2.0.0

  # Networking
  dio: 5.4.3+1

  # Formatting & locale
  intl: 0.19.0

  # Charts
  fl_chart: 0.67.0

  # PDF generation (receipts)
  pdf: 3.10.8
  printing: 5.12.0


  # Local prefs
  shared_preferences: 2.2.3

  # Files & images
  image_picker: 1.0.8
  file_picker: 8.0.0+1
  cached_network_image: 3.3.1

  # Utilities
  uuid: 4.3.3
  url_launcher: 6.2.5
  flutter_svg: 2.0.10+1
  google_fonts: 6.2.1
  connectivity_plus: 6.0.1

  cupertino_icons: 1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/