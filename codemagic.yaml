# Codemagic CI/CD — Lintel (Techforge Developers Limited)
workflows:

  ios-release:
    name: Lintel iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Codemagic API Key
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6784547677
        BUNDLE_ID: "dev.thetechforge.lintel"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: |
          keychain initialize
          # Create a fresh iOS Distribution certificate AND keep its private
          # key on this machine (the old API-key cert had no private key here,
          # which is why signing kept failing). Revoke the orphaned cert in the
          # Apple Developer portal first if this hits the 2-certificate limit.
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save
          # Create/fetch the App Store provisioning profile (binds to the cert)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: DEBUG show signing files
        script: |
          echo "=== Provisioning profiles on machine ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "NONE FOUND"
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning || true
      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ios --release --no-codesign
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --archive-flags="-allowProvisioningUpdates"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true