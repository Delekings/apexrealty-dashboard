# Codemagic CI/CD — Lintel (Techforge Developers Limited)
workflows:

  # ===========================================================================
  # iOS — UNCHANGED. Stays on Flutter 3.19.6 (matches the build in App Review).
  # ===========================================================================
  ios-release:
    name: Lintel iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Codemagic API Key
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.thetechforge.lintel
      vars:
        APP_STORE_APPLE_ID: 6784547677
        BUNDLE_ID: "dev.thetechforge.lintel"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;
      - name: Create export options
        script: |
          cat > /tmp/export.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>2SY29F99Q9</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.thetechforge.lintel</key>
              <string>Lintel App Store</string>
            </dict>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=/tmp/export.plist
          echo "=== IPA result ==="
          find build/ios/ipa -name "*.ipa" || echo "NO IPA"
      - name: Upload to App Store Connect
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA"
          app-store-connect publish --path "$IPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ===========================================================================
  # ANDROID — NEW. Flutter 3.35.x for 16 KB page-size support (newer engine
  # ships 16 KB-aligned libflutter.so). Signs with the lintel_distribution
  # keystore and builds the .aab for Google Play.
  # ===========================================================================
  android-release:
    name: Lintel Android Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: 3.35.4
      android_signing:
        - lintel_distribution
      vars:
        PACKAGE_NAME: "dev.thetechforge.lintel"
    scripts:
      - name: Set up key.properties (from Codemagic keystore)
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          echo "key.properties written:"
          sed 's/=.*/=***/' "$CM_BUILD_DIR/android/key.properties"
      - name: Un-pin pdf / printing for the newer Flutter engine
        script: |
          # On Flutter 3.35 the old ViewConfiguration.fromView problem is gone,
          # so the 3.19-era pins (pdf 3.10.7 / printing 5.11.1) can move up.
          # Relax them to caret ranges and let pub resolve compatible versions.
          sed -i '' 's/^  pdf: 3.10.7/  pdf: ^3.11.0/' pubspec.yaml || sed -i 's/^  pdf: 3.10.7/  pdf: ^3.11.0/' pubspec.yaml
          sed -i '' 's/^  printing: 5.11.1/  printing: ^5.13.0/' pubspec.yaml || sed -i 's/^  printing: 5.11.1/  printing: ^5.13.0/' pubspec.yaml
          echo "=== pubspec pdf/printing now ==="
          grep -E "pdf:|printing:" pubspec.yaml
      - name: Flutter packages
        script: flutter pub get
      - name: Flutter analyze (non-blocking)
        script: flutter analyze || true
      - name: Build AAB
        script: |
          flutter build appbundle --release
          echo "=== AAB result ==="
          find build -name "*.aab" || echo "NO AAB"
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt