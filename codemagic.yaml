# Codemagic CI/CD — Lintel (Techforge Developers Limited)
# The app_store_connect integration name (Codemagic API Key) must match the
# App Store Connect API key name set in the Codemagic UI.
workflows:

  android-release:
    name: Lintel Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.0
      java: 17
      android_signing:
        - LINTEL_KEYSTORE        # <-- Codemagic UI > Code signing identities (Android)
      vars:
        PACKAGE_NAME: "dev.thetechforge.lintel"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-release:
    name: Lintel iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Codemagic API Key   # <-- Codemagic UI integration name
    environment:
      flutter: 3.22.0
      xcode: latest               # Xcode 26.x — meets Apple's iOS 26 SDK requirement
      cocoapods: default
      ios_signing:                # Codemagic-managed automatic signing (creates cert + profile)
        distribution_type: app_store
        bundle_identifier: dev.thetechforge.lintel
      vars:
        APP_STORE_APPLE_ID: 6784547677
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true