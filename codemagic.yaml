# Codemagic CI/CD — Lintel (Techforge Developers Limited)
workflows:

  ios-release:
    name: Lintel iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Codemagic API Key
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.thetechforge.lintel
      vars:
        APP_STORE_APPLE_ID: 6784547677
        BUNDLE_ID: "dev.thetechforge.lintel"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: DEBUG show signing files
        script: |
          echo "=== Provisioning profiles on machine ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "NONE FOUND"
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning || true
      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true