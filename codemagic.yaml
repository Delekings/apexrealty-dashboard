# Codemagic CI/CD — Lintel (Techforge Developers Limited)
workflows:

  ios-release:
    name: Lintel iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Codemagic API Key
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.thetechforge.lintel
      vars:
        APP_STORE_APPLE_ID: 6784547677
        BUNDLE_ID: "dev.thetechforge.lintel"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release
      - name: Upload to App Store Connect (TestFlight)
        script: |
          echo "=== Searching for IPA anywhere in the tree ==="
          find . -name "*.ipa" 2>/dev/null || echo "no ipa found anywhere"
          IPA=$(find . -name "*.ipa" 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "ERROR: No .ipa was produced by the build."
            echo "=== Contents of build/ios ==="
            ls -R build/ios 2>/dev/null || echo "build/ios does not exist"
            exit 1
          fi
          echo "Found IPA at: $IPA"
          app-store-connect publish --path "$IPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true