# Codemagic CI/CD — Lintel (Techforge Developers Limited)
# Produces a signed .ipa as a downloadable artifact for Transporter upload.
workflows:

  ios-release:
    name: Lintel iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Codemagic API Key
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.thetechforge.lintel
      vars:
        APP_STORE_APPLE_ID: 6784547677
        BUNDLE_ID: "dev.thetechforge.lintel"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: |
          xcode-project use-profiles
          echo "=== Installed provisioning profiles ==="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo -n "Profile name: "
            security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "(could not read)"
          done
      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;
      - name: Create export options
        script: |
          cat > /tmp/export.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>2SY29F99Q9</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.thetechforge.lintel</key>
              <string>Lintel App Store</string>
            </dict>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=/tmp/export.plist
          echo "=== IPA result ==="
          find build/ios/ipa -name "*.ipa" || echo "NO IPA — export failed"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log