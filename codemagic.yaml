# Codemagic CI/CD — Lintel (Techforge Developers Limited)
# Reference names in CAPS_PLACEHOLDERS must match what you set in the Codemagic UI.
workflows:

  android-release:
    name: Lintel Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.0
      java: 17
      android_signing:
        - LINTEL_KEYSTORE        # <-- Codemagic UI > Code signing identities (Android)
      vars:
        PACKAGE_NAME: "dev.thetechforge.lintel"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/mapping.txt
    publishing:
      # First release: comment this out, download the .aab artifact, and upload
      # manually to the Play Console (Google requires the first build by hand).
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS   # Codemagic UI > Environment variables
        track: internal
        submit_as_draft: true

  ios-release:
    name: Lintel iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: 3.22.0
      xcode: latest               # Xcode 26.x — meets Apple's iOS 26 SDK requirement
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.thetechforge.lintel
      integrations:
        app_store_connect: ASC_API_KEY   # <-- Codemagic UI integration name for key H43G7HDTBP
      vars:
        APP_STORE_APPLE_ID: 6784547677    # <-- App Store Connect numeric app id (after you create the app)
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true